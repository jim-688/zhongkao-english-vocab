name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m py_compile build_vocab.py verify_vocab.py
      - name: Validate vocabulary JSON
        run: python -c "import json; json.load(open('zhongkao_vocab.json', encoding='utf-8')); json.load(open('zhongkao_vocab_simple.json', encoding='utf-8'))"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run vocabulary verification
        run: python verify_vocab.py
